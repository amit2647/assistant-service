name: Tests

# Unit tests for this repository alone. The whole platform is exercised
# together by the integration workflow in the parent repo, customer-management.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci --no-audit --no-fund

      - run: npm test
